<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>NYC Photo Shows · layout prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- PROTOTYPE v2 (gallery/proto-v2/): layout only. No sync. Not for merge. -->
<div id="app">

  <div class="proto-bar">
    <span>Prototype v2 · layout only, no sync</span>
    <button id="phoneToggle" onclick="togglePhoneFrame()">Phone frame</button>
    <button onclick="togglePalette()">Palette</button>
  </div>

  <header class="site-header">
    <div class="header-top">
      <div>
        <h1>NYC<br> Photo Shows</h1>
        <p class="tagline">Current exhibitions</p>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="plan" onclick="setMode('plan')">Plan</button>
        <button class="mode-btn"        data-mode="walk" onclick="setMode('walk')">Walk</button>
      </div>
    </div>
    <div class="toolbar" id="toolbar"></div>
  </header>

  <div id="planMode" class="plan-layout">
    <div class="scroll-body" id="listingPage"></div>
  </div>

  <div id="walkMode" class="view-list">
    <div class="walk-list-view" id="walkList"></div>
    <div id="walkMap"></div>
  </div>

</div>

<div id="filterMenu" onclick="if(event.target===this)closeFilterMenu()">
  <div class="menu-box" id="filterMenuBox" role="dialog" aria-label="Filter shows"></div>
</div>

<div id="detailScrim" onclick="closeDetail()"></div>
<div id="detailPage">
  <button class="detail-back" onclick="closeDetail()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M9 2.5L4 7L9 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back
  </button>
  <div id="detailContent"></div>
</div>

<div id="palettePanel" onclick="if(event.target===this)togglePalette()">
  <div class="palette-box">
    <div class="palette-head">Neighborhood colors <button onclick="togglePalette()">Close</button></div>
    <div id="paletteBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
